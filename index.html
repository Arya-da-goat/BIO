<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
overflow-y:auto;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
-45deg,
#ff0000,
#ff7300,
#00ff88,
#00bfff,
#7a00ff,
#ff0088
);
background-size:600% 600%;
animation:rgb 35s ease infinite;
}

@keyframes rgb{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

#enter{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
font-weight:700;
color:white;
cursor:pointer;
z-index:9999;
transition:1s;
}

.glow{
position:fixed;
width:250px;
height:250px;
border-radius:50%;
background:rgba(255,255,255,.08);
filter:blur(70px);
pointer-events:none;
transform:translate(-50%,-50%);

z-index:5;
box-shadow:
0 0 30px rgba(0,0,0,.25),
0 0 60px rgba(255,255,255,.05);
}

.card{
width:420px;
max-width:90%;
padding:35px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.15);

text-align:center;
color:white;

opacity:0;
transform:translateY(30px);

animation:float 4s ease-in-out infinite;

z-index:10;
position:relative;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.show{
animation:
fade .8s forwards,
float 4s ease-in-out infinite;
}

@keyframes fade{
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes rgbBreath{
0%{
background-position:0% 50%;
}
50%{
background-position:100% 50%;
}
100%{
background-position:0% 50%;
}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
box-shadow:
0 0 15px rgba(255,255,255,0.15),
0 0 30px rgba(255,255,255,0.1);
}

50%{
transform:scale(1.06);
box-shadow:
0 0 30px rgba(255,255,255,0.4),
0 0 60px rgba(255,255,255,0.25);
}
}

.avatar-border{
width:160px;
height:160px;
margin:auto;
padding:5px;
border-radius:50%;
overflow:hidden;

background:linear-gradient(
45deg,
#ff0000,
#ff7300,
#00ff88,
#00bfff,
#7a00ff,
#ff0088
);

background-size:300% 300%;

animation:
rgbBreath 8s ease-in-out infinite,
pulse 4s ease-in-out infinite;

box-shadow:
0 0 20px rgba(255,255,255,0.25);
}

.avatar{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
display:block;
}

h1{
margin-top:15px;
font-size:2rem;
}

.bio{
margin-top:8px;
height:28px;
opacity:.9;
}

.links{
margin-top:25px;
display:flex;
flex-direction:column;
gap:12px;
}

.btn{
text-decoration:none;
color:white;
padding:14px;
border-radius:14px;

background:rgba(255,255,255,.12);

transition:.3s;
font-weight:600;

position:relative;
overflow:hidden;
}

.btn::before{
content:"";
position:absolute;
top:0;
left:-100%;

width:100%;
height:100%;

background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.35),
transparent
);

transition:.6s;
}

.btn:hover::before{
left:100%;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 20px rgba(255,255,255,.25);
background:rgba(255,255,255,.2);
}

.btn i{
margin-right:10px;
transition:.3s;
}

.btn:hover i{
transform:scale(1.3) rotate(10deg);
}

.status{
margin-top:15px;
font-size:.9rem;
opacity:.8;
}

.dot{
display:inline-block;
width:10px;
height:10px;
background:#00ff88;
border-radius:50%;
margin-right:5px;
box-shadow:0 0 10px #00ff88;
}
@media (max-width: 500px){

.card{
    width:95%;
    padding:25px;
}

.avatar-border{
    width:130px;
    height:130px;
}

h1{
    font-size:1.6rem;
}

.bio{
    font-size:0.9rem;
}

.btn{
    padding:12px;
}

}
.visits{
text-align:left;
margin-top:10px;
font-size:.9rem;
opacity:.8;
}
#visualizer{
width:100%;
height:80px;
margin-top:15px;
}    
</style>
</head>

<body>

<audio id="bgm" loop>
    <source src="soulprodmusic-unpacking-loop-ycle-138250.mp3" type="audio/mpeg">
</audio>

<div id="enter">
Click To Enter
</div>

<div class="glow" id="glow"></div>

<div class="card" id="card">

<div class="avatar-border">
<img
class="avatar"
src="https://i.ibb.co/MxMvSrkT/PFP-webp.webp">
</div>

<h1>Arya</h1>

<div class="bio" id="typing"></div>

<div class="status">
<span class="dot"></span>
Welcome to my profile
</div>
    
<canvas id="visualizer" width="300" height="80"></canvas>
<div class="links">

<a class="btn"
href="https://discord.com/users/YOUR_ID"
target="_blank">
<i class="fab fa-discord"></i> Discord
</a>

<a class="btn"
href="https://youtube.com/@YOURCHANNEL"
target="_blank">
<i class="fab fa-youtube"></i> YouTube
</a>

<a class="btn"
href="https://discord.gg/YOURINVITE"
target="_blank">
<i class="fas fa-rocket"></i> Server
</a>

<div class="visits">
Visits: <span id="visits">Loading...</span>
</div>

</div>

<script>

const bios=[
"Discord Bot Developer",
"YouTuber",
"Gamer",
"Cloudflare User"
];

let i=0;
let j=0;
let deleting=false;

function type(){

const text=bios[i];

if(!deleting){
j++;
}
else{
j--;
}

document.getElementById("typing").textContent=
text.substring(0,j);

if(!deleting && j===text.length){
deleting=true;
setTimeout(type,1200);
return;
}

if(deleting && j===0){
deleting=false;
i=(i+1)%bios.length;
}

setTimeout(type,deleting?50:100);
}

type();

const glow=document.getElementById("glow");

document.addEventListener("mousemove",e=>{
glow.style.left=e.clientX+"px";
glow.style.top=e.clientY+"px";
});

document.getElementById("enter")
.onclick=()=>{

document.getElementById("bgm").volume = 0.2;
document.getElementById("bgm").play();
const audio = document.getElementById("bgm");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const source = audioCtx.createMediaElementSource(audio);

const analyser = audioCtx.createAnalyser();

source.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize = 2048;

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

function draw() {
    requestAnimationFrame(draw);

    analyser.getByteTimeDomainData(dataArray);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const midY = canvas.height / 2;

    const step = 2; // 🔥 very high detail sampling (important)

    ctx.lineWidth = 2;
    ctx.lineJoin = "miter";   // 🔥 sharp corners (NOT round)
    ctx.lineCap = "butt";     // 🔥 removes soft ends

    ctx.shadowBlur = 0;       // ❌ remove glow blur (blur = softness killer)
    
    // ===== MAIN CRISP CORE =====
    ctx.beginPath();
    ctx.strokeStyle = "#00e5ff";

    let x = 0;

    for (let i = 0; i < bufferLength; i += step) {

        const v = dataArray[i] / 128.0;

        // 🔥 HARD CLAMPED SPIKE (no smooth curves)
        let y = midY + (v - 1) * 90;

        // 🔥 quantize (THIS is what makes it "sharp digital anime")
        y = Math.round(y / 4) * 4;

        x = (i / bufferLength) * canvas.width;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }

    ctx.stroke();

    // ===== SECOND ENERGY EDGE LAYER =====
    ctx.beginPath();
    ctx.strokeStyle = "#ff00aa";
    ctx.lineWidth = 1;

    x = 0;

    for (let i = 0; i < bufferLength; i += step) {

        const v = dataArray[i] / 128.0;

        let y = midY + (v - 1) * 110;

        // 🔥 even harsher quantization
        y = Math.round(y / 6) * 6;

        x = (i / bufferLength) * canvas.width;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }

    ctx.stroke();
}
    

draw();    

document.getElementById("enter")
.style.opacity="0";

setTimeout(()=>{
document.getElementById("enter")
.style.display="none";
},1000);

document.getElementById("card")
.classList.add("show");

};
</script>
<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

<div id="particles"></div>

<style>
#particles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
}
</style>

<script>
tsParticles.load("particles", {
    fpsLimit: 60,

    particles: {
        number: {
            value: 80
        },

        color: {
            value: [
                "#ff0088",
                "#7a00ff",
                "#00bfff",
                "#00ff88"
            ]
        },

        shape: {
            type: "circle"
        },

        opacity: {
            value: 0.4
        },

        size: {
            value: { min: 1, max: 4 }
        },

        links: {
            enable: true,
            distance: 140,
            color: "#ffffff",
            opacity: 0.15,
            width: 1
        },

        move: {
            enable: true,
            speed: 1,
            outModes: {
                default: "bounce"
            }
        }
    },

    interactivity: {
        events: {
            onHover: {
                enable: true,
                mode: "grab"
            }
        },

        modes: {
            grab: {
                distance: 180,
                links: {
                    opacity: 0.4
                }
            }
        }
    },

    detectRetina: true
});
</script>

<script>
fetch("https://api.countapi.xyz/hit/lordz-profile/visits")
.then(res => res.json())
.then(data => {
document.getElementById("visits").innerText = data.value;
});
</script>

</body>
</html>
