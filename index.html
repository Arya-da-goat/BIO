<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
overflow-y:auto;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
-45deg,
#ff0000,
#ff7300,
#00ff88,
#00bfff,
#7a00ff,
#ff0088
);
background-size:600% 600%;
animation:rgb 35s ease infinite;
}

@keyframes rgb{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

#enter{
position:fixed;
inset:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
font-weight:700;
color:white;
cursor:pointer;
z-index:9999;

.glow{
position:fixed;
width:250px;
height:250px;
border-radius:50%;
background:rgba(255,255,255,.08);
filter:blur(70px);
pointer-events:none;
transform:translate(-50%,-50%);

z-index:5;
box-shadow:
0 0 30px rgba(0,0,0,.25),
0 0 60px rgba(255,255,255,.05);
}

.card{
width:420px;
max-width:90%;
padding:35px;
border-radius:28px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.15);

text-align:center;
color:white;

opacity:0;
transform:translateY(30px);

animation:float 4s ease-in-out infinite;

z-index:10;
position:relative;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.show{
animation:
fade .8s forwards,
float 4s ease-in-out infinite;
}

@keyframes fade{
to{
opacity:1;
transform:translateY(0);
}
}

@keyframes rgbBreath{
0%{
background-position:0% 50%;
}
50%{
background-position:100% 50%;
}
100%{
background-position:0% 50%;
}
}

@keyframes pulse{
0%,100%{
transform:scale(1);
box-shadow:
0 0 15px rgba(255,255,255,0.15),
0 0 30px rgba(255,255,255,0.1);
}

50%{
transform:scale(1.06);
box-shadow:
0 0 30px rgba(255,255,255,0.4),
0 0 60px rgba(255,255,255,0.25);
}
}

.avatar-border{
width:160px;
height:160px;
margin:auto;
padding:5px;
border-radius:50%;
overflow:hidden;

background:linear-gradient(
90deg,
#ff0000,
#ff7300,
#ffff00,
#00ff00,
#00bfff,
#0000ff,
#7a00ff,
#ff0088,
#ff0000
);

background-size:300% 300%;

animation:
rgbBreath 3s ease-in-out infinite,
pulse 4s ease-in-out infinite;

box-shadow:
0 0 20px #ff0088,
0 0 40px #7a00ff,
0 0 60px #00bfff;
}

.avatar{

height:100%;

border-radius:50%;
display:block;
}

h1{
margin-top:15px;

}

.bio{
margin-top:8px;
height:28px;
opacity:.9;
}

.links{
margin-top:25px;

gap:12px;
}

.btn{
text-decoration:none;
color:white;
padding:14px;
border-radius:14px;

background:rgba(255,255,255,.12);

transition:.3s;
font-weight:600;

position:relative;
overflow:hidden;
}

.btn::before{
content:"";
position:absolute;
top:0;
left:-100%;

width:100%;
height:100%;

background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.35),
transparent
);

transition:.6s;
}

.btn:hover::before{
left:100%;
}

.btn:hover{
transform:translateY(-3px);
box-shadow:0 0 20px rgba(255,255,255,.25);
background:rgba(255,255,255,.2);
}

.btn i{
margin-right:10px;

.btn:hover i{

}

.status{
margin-top:15px;
font-size:.9rem;
opacity:.8;
}

.dot{
display:inline-block;
width:10px;
height:10px;
background:#00ff88;
border-radius:50%;
margin-right:5px;

}

<script>

const bios=[
"Discord Bot Developer",
"YouTuber",
"Gamer",
"Owner of whip-bios" ,
"Cloudflare User"
];

let i=0;
let j=0;
let deleting=false;

function type(){

const text=bios[i];

if(!deleting){
j++;
}
else{
j--;
}

document.getElementById("typing").textContent=
text.substring(0,j);

if(!deleting && j===text.length){
deleting=true;
setTimeout(type,1200);
return;
}

if(deleting && j===0){
deleting=false;
i=(i+1)%bios.length;
}

setTimeout(type,deleting?50:100);
}

type();

const glow=document.getElementById("glow");

document.addEventListener("mousemove",e=>{
glow.style.left=e.clientX+"px";
glow.style.top=e.clientY+"px";
});

document.getElementById("enter")
.onclick=()=>{

document.getElementById("bgm").volume = 0.2;
document.getElementById("bgm").play();
const audio = document.getElementById("bgm");

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const source = audioCtx.createMediaElementSource(audio);

const analyser = audioCtx.createAnalyser();

source.connect(analyser);
analyser.connect(audioCtx.destination);

analyser.fftSize = 2048;

const canvas = document.getElementById("visualizer");
const ctx = canvas.getContext("2d");

const bufferLength = analyser.frequencyBinCount;
const dataArray = new Uint8Array(bufferLength);

function draw() {
    requestAnimationFrame(draw);

    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const centerY = canvas.height / 2;
    const centerX = canvas.width / 2;

    const bars = 25;
    const barWidth = 2;
    const gap = 4;

    const gradient = ctx.createLinearGradient(
        0,
        0,
        canvas.width,
        0
    );

    gradient.addColorStop(0, "#00bfff");
    gradient.addColorStop(0.5, "#7a00ff");
    gradient.addColorStop(1, "#ff0088");

    ctx.fillStyle = gradient;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00bfff";

    for (let i = 0; i < bars; i++) {

        const value = dataArray[i];
        const height = 8 + (value / 255) * 40;

        const offset = (i + 0.25) * (barWidth + gap);

const leftX = centerX - offset - barWidth;
const rightX = centerX + offset;

        // Left side
        ctx.fillRect(leftX, centerY - height / 2, barWidth, height);
ctx.fillRect(rightX, centerY - height / 2, barWidth, height);
    }
}
    document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        audio.pause();
    } else {
        audio.play();
    }
});
window.addEventListener("pagehide", () => {
    audio.pause();
});
    
draw();
document.getElementById("enter")
.style.opacity="0";

setTimeout(()=>{
document.getElementById("enter")
.style.display="none";
},1000);

document.getElementById("card")
.classList.add("show");

};
</script>
